# Use this config as a template to enable self-managed Kubernetes Workload Identity
# (Kubernetes service account token -> OCI RPST token exchange).
#
# Required pod environment:
# - OCI_WORKLOAD_IDENTITY_DOMAIN_URL
# - OCI_WORKLOAD_IDENTITY_RESOURCE_TYPE
# - OCI_WORKLOAD_IDENTITY_CLIENT_ID and OCI_WORKLOAD_IDENTITY_CLIENT_SECRET
#   OR OCI_WORKLOAD_IDENTITY_USE_INSTANCE_PRINCIPAL_FOR_TOKEN_EXCHANGE=true
#
# Optional pod environment:
# - OCI_WORKLOAD_IDENTITY_TOKEN_PATH (defaults to /var/run/secrets/kubernetes.io/serviceaccount/token)
# - OCI_WORKLOAD_IDENTITY_REQUESTED_TOKEN_TYPE (defaults to urn:oci:token-type:oci-rpst)
# - OCI_WORKLOAD_IDENTITY_SUBJECT_TOKEN_TYPE (defaults to jwt)
# - OCI_WORKLOAD_IDENTITY_RPST_EXP
# - OCI_WORKLOAD_IDENTITY_PUBLIC_KEY
#
# auth.region is required for endpoint resolution when useWorkloadIdentity is enabled.
auth:
  region: us-phoenix-1

useWorkloadIdentity: true

# compartment configures Compartment within which the cluster resides.
compartment: ocid1.compartment.oc1..aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

# vcn configures the Virtual Cloud Network (VCN) within which the cluster resides.
vcn: ocid1.vcn.oc1..aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

loadBalancer:
  # subnet1 configures one of two subnets to which load balancers will be added.
  # OCI load balancers require two subnets to ensure high availability.
  subnet1: ocid1.subnet.oc1.phx.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

  # subnet2 configures the second of two subnets to which load balancers will be
  # added. OCI load balancers require two subnets to ensure high availability.
  subnet2: ocid1.subnet.oc1.phx.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

  securityListManagementMode: All

# Optional rate limit controls for accessing OCI API
rateLimiter:
  rateLimitQPSRead: 20.0
  rateLimitBucketRead: 5
  rateLimitQPSWrite: 20.0
  rateLimitBucketWrite: 5
